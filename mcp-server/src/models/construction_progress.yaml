name: construction_progress
label: "Ход строительства"
description: "Помесячные срезы готовности и затрат по корпусам."
physical:
  table: construction_progress
  primary_key: progress_id
  alias: p
dimensions:
  - name: progress_id
    label: "Идентификатор записи"
    type: integer
  - name: building_id
    label: "Идентификатор корпуса"
    type: integer
  - name: building
    label: "Корпус"
    type: string
    sql: "buildings.name"
    requires_join: ["buildings"]
    synonyms: ["дом", "корпус"]
  - name: building_full
    label: "Объект и корпус одной строкой"
    type: string
    sql: "objects.name || ' ' || buildings.name"
    requires_join: ["buildings", "objects"]
    synonyms: ["объект и корпус", "название корпуса с объектом", "ЖК и корпус"]
  - name: object
    label: "Объект (ЖК)"
    type: string
    sql: "objects.name"
    requires_join: ["buildings", "objects"]
    synonyms: ["жилой комплекс", "ЖК", "объект", "проект"]
  - name: month
    label: "Месяц среза"
    type: date
    synonyms: ["отчетная дата", "месяц"]
  - name: stage
    label: "Этап строительства"
    type: string
    synonyms: ["стадия", "этап работ"]
    domain: ["Подготовка территории", "Фундамент", "Возведение коробки", "Кровля и фасад", "Внутренние инженерные сети", "Отделка мест общего пользования", "Благоустройство"]
measures:
  - name: construction_costs
    label: "Затраты на строительство (факт)"
    type: simple
    sql: "SUM(construction_progress.fact_cost)"
    synonyms: ["затраты", "расходы на стройку", "потрачено на строительство"]
    notes: "Только стройка; коммерческие расходы сюда не входят."
  - name: planned_construction_costs
    label: "Затраты на строительство (план)"
    type: simple
    sql: "SUM(construction_progress.plan_cost)"
    synonyms: ["плановые затраты на стройку"]
  - name: readiness_pct
    label: "Готовность корпуса, %"
    type: latest_snapshot
    sql: "construction_progress.fact_pct"
    snapshot_key: "construction_progress.building_id"
    order_by: "construction_progress.month DESC"
    synonyms: ["процент готовности", "ход строительства", "степень готовности"]
    notes: "fact_pct — нарастающий итог. Проценты по месяцам НЕ суммировать и НЕ усреднять. Брать значение за последний доступный месяц корпуса."
  - name: planned_readiness_pct
    label: "Плановая готовность корпуса, %"
    type: latest_snapshot
    sql: "construction_progress.plan_pct"
    snapshot_key: "construction_progress.building_id"
    order_by: "construction_progress.month DESC"
    synonyms: ["план готовности"]
    notes: "plan_pct — тоже нарастающий итог; брать последнее значение."
